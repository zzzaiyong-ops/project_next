server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /health {
        access_log off;
        return 200 '{"status":"ok","app":"ssg-m-hub"}';
        add_header Content-Type application/json;
    }

    location / {
        try_files $uri $uri/ /index.html;
        sub_filter '</head>' '<script>(function(){var slug="ssg-m-hub",api="http://10.222.252.147:7054/api/analytics/collect";var vid=function(n){var m=document.cookie.match(new RegExp("(^| )"+n+"=([^;]+)"));return m?m[2]:null}("_vp_id");if(!vid){vid="vp_"+Math.random().toString(36).substr(2,9)+Date.now().toString(36);var d=new Date();d.setTime(d.getTime()+365*864e5);document.cookie="_vp_id="+vid+";expires="+d.toUTCString()+";path=/;SameSite=Lax"}var t0=Date.now(),payload={projectSlug:slug,visitorId:vid,path:location.pathname+location.search,referrer:document.referrer||null,userAgent:navigator.userAgent};function snd(u,b){if(navigator.sendBeacon)navigator.sendBeacon(u,new Blob([JSON.stringify(b)],{type:"text/plain"}));else try{var x=new XMLHttpRequest();x.open("POST",u,true);x.setRequestHeader("Content-Type","text/plain");x.send(JSON.stringify(b))}catch(e){}}snd(api,payload);function leave(){var dur=Math.round((Date.now()-t0)/1e3);if(dur<1)return;var b={projectSlug:slug,visitorId:vid,path:payload.path,duration:dur};if(navigator.sendBeacon)navigator.sendBeacon(api,new Blob([JSON.stringify(b)],{type:"text/plain"}));else try{var x=new XMLHttpRequest();x.open("POST",api,false);x.setRequestHeader("Content-Type","text/plain");x.send(JSON.stringify(b))}catch(e){}}document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")leave()});window.addEventListener("pagehide",leave)})()</script></head>';
        sub_filter_once on;
        sub_filter_types text/html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
